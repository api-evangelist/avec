aid: avec
name: Avec
description: >-
  Avec is a free, AI-powered email application for Gmail, built by Nearly Extraterrestrial
  Technology, Inc. The iOS app prioritizes a user's inbox and surfaces important messages one
  at a time in a card-based interface, learning individual preferences over time so the most
  relevant email rises to the top. Users swipe to mark messages done or save them for later,
  compose replies by voice in their own writing style, receive smart notifications with email
  summaries, and search their mailbox with natural-language AI. Founded in 2024 by CEO Jonathan
  Unikowski and backed at seed stage by Bloomberg Beta and Lightspeed Venture Partners, Avec is
  a consumer productivity product rather than an API provider - it exposes no public developer
  API, SDK, or documentation surface at this time.
